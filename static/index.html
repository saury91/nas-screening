      <button id="btn-search" class="icon-btn" title="搜索（/）" data-focus aria-label="搜索">

<!-- 播放器 -->
<div id="playerlayer" class="overlay playerlayer" data-focus-scope hidden></div>

<!-- 音乐播放器 -->
<div id="miniplayer" class="miniplayer" hidden></div>

<audio id="audio" preload="metadata"></audio>

<div id="modal-root"></div>
<div id="auth-gate" class="auth-gate" hidden></div>
<div id="cast-sheet" class="cast-sheet" hidden></div>

<div id="searchlayer" class="overlay searchlayer" data-focus-scope hidden>

    <div id="search-body" class="search-body"></div>
  </div>
</div>

<div id="miniplayer" class="miniplayer" hidden></div>

<audio id="audio" preload="metadata"></audio>

<script src="/static/hls.js"></script>

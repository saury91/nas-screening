<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>安装放映室 TV</title>
<style>
  :root{--bg:#07080b;--panel:#12141a;--line:rgba(255,255,255,.12);
        --accent:#ffcf7a;--text:#f2f3f6;--dim:#8a919e}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:
      radial-gradient(900px 600px at 50% -10%, rgba(255,164,92,.14), transparent 65%), var(--bg);
    color:var(--text);font:16px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:grid;place-items:center;padding:6vh 5vw}
  .wrap{width:min(760px,100%)}
  .brand{display:flex;align-items:center;gap:14px;margin-bottom:26px}
  .mark{width:44px;height:44px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%,#ffe7b6,var(--accent) 46%,#d98a3c 100%);
    position:relative;box-shadow:0 8px 26px rgba(255,159,90,.34)}
  .mark i{position:absolute;top:12px;left:17px;width:0;height:0;
    border-left:12px solid rgba(30,18,6,.82);
    border-top:8px solid transparent;border-bottom:8px solid transparent}
  h1{margin:0;font-size:26px;letter-spacing:.02em}
  .sub{color:var(--dim);font-size:14px;margin-top:4px}
  .card{background:linear-gradient(180deg,#16181f,#0d0f14);border:1px solid var(--line);
    border-radius:20px;padding:24px;margin-top:18px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .ver{font-size:14px;color:var(--dim)}
  .ver b{color:var(--accent);font-weight:600}
  .btn{display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 30px;
    border-radius:14px;background:linear-gradient(180deg,#ffe0a2,var(--accent));
    color:#1b1206;font-weight:700;font-size:17px;text-decoration:none;
    box-shadow:0 14px 34px rgba(255,180,90,.26)}
  .btn:active{transform:translateY(1px)}
  ol{margin:18px 0 0;padding-left:22px;color:#c8ccd4;font-size:15px}
  li{margin:8px 0}
  .tip{margin-top:16px;padding:12px 16px;border-radius:12px;
    background:rgba(255,207,122,.08);border:1px solid rgba(255,207,122,.2);
    color:#e8d6b4;font-size:13.5px}
  .foot{margin-top:18px;color:#6b7280;font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark"><i></i></div>
    <div>
      <h1>放映室 TV</h1>
      <div class="sub">装到电视上，遥控器直接操作</div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div class="ver">版本 <b id="ver">加载中…</b></div>
      <a class="btn" id="dl" href="/api/app/download?kind=tv">下载安装包</a>
    </div>
    <ol>
      <li>点上面的「下载安装包」，等它下完</li>
      <li>系统弹出安装确认时选 <b>安装</b></li>
      <li>若提示「禁止安装未知来源」，去 <b>设置 → 安全 → 未知来源</b> 打开后重试</li>
      <li>装好打开，会自动找到 NAS，然后输 PIN</li>
    </ol>
    <div class="tip">装不上？把 APK 拷到 U 盘，插到电视上用「文件管理」打开，效果一样。</div>
  </div>

  <div class="foot">下载地址：/api/app/download?kind=tv　·　本页不需要登录</div>
</div>
<script>
fetch('/api/app/latest?kind=tv').then(r => r.json()).then(d => {
  const el = document.getElementById('ver');
  el.textContent = d.versionName || '—';
}).catch(() => { document.getElementById('ver').textContent = '未发布'; });
</script>
</body>
</html>

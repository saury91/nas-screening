name: native

# 原生端（KMP）的回归闸门。
# 数据层的合并/解析逻辑改动最频繁，也最容易在别处悄悄坏掉，所以单测必跑。
on:
  push:
    paths:
      - "native/**"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "native/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 不再用 android-actions/setup-android：它启动时会先装 `tools` 这个包，
      # 而新版 cmdline-tools 仓库里已经没有该包，直接
      # `Warning: Failed to find package 'tools'` + exit 1 把 job 打死。
      # GitHub 的 ubuntu 镜像本来就带 cmdline-tools 与 platform-tools，用它自带的即可。
      # compileSdk 35 / targetSdk 35 是写死的，缺平台包时 AGP 会直接失败。
      - name: 安装 SDK 平台
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            # 镜像里的目录名可能是 latest，也可能带版本号（如 16.0）
            SDKM="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n1)"
          fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      # core 是纯 Kotlin，几十秒出结果；data 需要 Android 运行时，稍慢。
      # 两个都必须跑：data 里的合并/原子写/熔断是「改一处坏一片」的逻辑，
      # 只在本地跑等于没有闸门。
      - name: 数据层单测
        run: ./gradlew :core:jvmTest :data:testDebugUnitTest --no-daemon

      - name: 编译 debug APK
        run: ./gradlew :app-tv:assembleDebug :app-phone:assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: native-debug-apk
          path: |
            native/app-tv/build/outputs/apk/debug/*.apk
            native/app-phone/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: native

# 原生端（KMP）的回归闸门。
# 数据层的合并/解析逻辑改动最频繁，也最容易在别处悄悄坏掉，所以单测必跑。
on:
  push:
    paths:
      - "native/**"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "native/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 35 / targetSdk 35 是写死的，缺平台包时 AGP 会直接失败
      - name: 安装 SDK 平台
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      # 纯 Kotlin，不碰 Android，几十秒出结果 —— 先失败先暴露
      - name: 数据层单测
        run: ./gradlew :core:jvmTest --no-daemon

      - name: 编译 debug APK
        run: ./gradlew :app-tv:assembleDebug :app-phone:assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: native-debug-apk
          path: |
            native/app-tv/build/outputs/apk/debug/*.apk
            native/app-phone/build/outputs/apk/debug/*.apk
          if-no-files-found: error

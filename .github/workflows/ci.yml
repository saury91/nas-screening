name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 语法编译
        run: python -m compileall -q app.py server tests
      - name: 纯函数单测
        run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: ES Module 语法检查（零构建，不装依赖）
        run: |
          fail=0
          for f in $(find static/app -name '*.js'); do
            node --input-type=module --check < "$f" || fail=1
          done
          exit $fail
